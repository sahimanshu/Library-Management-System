<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <h1>📚 Library Management System</h1>
    </header>

    <div class="container">
        <div class="grid-wrapper">
            
            <!-- LEFT COLUMN: Input Forms -->
            <div class="forms-column">
                
                <!-- Add Book -->
                <div class="card">
                    <h2>Add New Book</h2>
                    <div class="form-group">
                        <input type="text" id="title" placeholder="Book Title">
                        <input type="text" id="author" placeholder="Author">
                        <input type="text" id="category" placeholder="Category">
                        <input type="number" id="copies" placeholder="Available Copies">
                        <button onclick="addBook()">Add Book</button>
                    </div>
                </div>

                <!-- Add Student -->
                <div class="card">
                    <h2>Add New Student</h2>
                    <div class="form-group">
                        <input type="text" id="studentName" placeholder="Student Name">
                        <input type="email" id="studentEmail" placeholder="Student Email">
                        <button onclick="addStudent()" class="btn-secondary">Add Student</button>
                    </div>
                </div>

                <!-- Issue Book -->
                <div class="card">
                    <h2>Issue Book</h2>
                    <div class="form-group">
                        <input type="number" id="studentId" placeholder="Student ID">
                        <input type="number" id="bookId" placeholder="Book ID">
                        <input type="date" id="issueDate">
                        <button onclick="issueBook()" class="btn-accent">Issue Book</button>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN: Data Tables -->
            <div class="tables-column">
                
                <!-- Books List -->
                <div class="card">
                    <div class="card-header">
                        <h2>Available Books</h2>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Author</th>
                                    <th>Category</th>
                                    <th>Copies</th>
                                </tr>
                            </thead>
                            <tbody id="bookTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Students List -->
                <div class="card">
                    <div class="card-header">
                        <h2>Registered Students</h2>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Issued Books List -->
                <div class="card">
                    <div class="card-header">
                        <h2>Issued Books Record</h2>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Student Name</th>
                                    <th>Book ID</th>
                                    <th>Book Title</th>
                                    <th>Issue Date</th>
                                </tr>
                            </thead>
                            <tbody id="issuedTable"></tbody>
                        </table>
                    </div>
                </div>

            </div>
            <!-- Return Book -->
<div class="card">
    <h2>Return Book</h2>
    <div class="form-group">
        <input type="number" id="returnStudentId" placeholder="Student ID">
        <input type="number" id="returnBookId" placeholder="Book ID">
        <button onclick="processReturn()" class="btn-return-form">Return Book</button>
    </div>
</div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
